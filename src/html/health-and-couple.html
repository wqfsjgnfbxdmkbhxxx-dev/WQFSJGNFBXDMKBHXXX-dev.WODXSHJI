    <!-- 月经记录屏幕 -->
    <div id="period-tracker-screen" class="screen">
      <div class="header">
        <span class="back-btn" onclick="showScreen('home-screen')">‹</span>
        <span>月经记录</span>
        <span style="width: 30px;"></span>
      </div>
      <div class="period-nav">
        <button class="period-nav-btn active" data-view="calendar" onclick="switchPeriodView('calendar')">日历</button>
        <button class="period-nav-btn" data-view="history" onclick="switchPeriodView('history')">历史</button>
        <button class="period-nav-btn" data-view="report" onclick="switchPeriodView('report')">报告</button>
        <button class="period-nav-btn" data-view="settings" onclick="switchPeriodView('settings')">设置</button>
      </div>
      <div id="period-calendar-view" class="period-view">
        <div id="period-calendar-content"></div>
      </div>
      <div id="period-history-view" class="period-view" style="display: none;">
        <div id="period-history-content"></div>
      </div>
      <div id="period-report-view" class="period-view" style="display: none;">
        <div id="period-report-content"></div>
      </div>
      <div id="period-settings-view" class="period-view" style="display: none;">
        <div id="period-settings-content"></div>
      </div>
    </div>

    <!-- 月经记录 - 添加记录弹窗 -->
    <div id="period-add-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <span>记录经期</span>
          <span class="close-btn" onclick="hidePeriodAddModal()">×</span>
        </div>
        <div class="modal-body" style="padding: 20px;">
          <div class="period-form-group">
            <label>开始日期</label>
            <input type="date" id="period-start-date" class="period-input">
          </div>
          <div class="period-form-group">
            <label>结束日期（可选）</label>
            <input type="date" id="period-end-date" class="period-input">
          </div>
          <div class="period-form-group">
            <label>流量</label>
            <select id="period-flow" class="period-input">
              <option value="light">少量</option>
              <option value="medium" selected>中等</option>
              <option value="heavy">较多</option>
            </select>
          </div>
          <div class="period-form-group">
            <label>症状（可选）</label>
            <input type="text" id="period-symptoms" class="period-input" placeholder="如：痛经、腰酸...">
          </div>
          <div class="period-form-group">
            <label>心情</label>
            <select id="period-mood" class="period-input">
              <option value="great">很好</option>
              <option value="good">不错</option>
              <option value="normal" selected>一般</option>
              <option value="bad">不好</option>
              <option value="terrible">很差</option>
            </select>
          </div>
          <div class="period-form-group">
            <label>备注（可选）</label>
            <textarea id="period-notes" class="period-input" rows="3" placeholder="其他想记录的..."></textarea>
          </div>
          <div class="period-form-group">
            <label>痛经程度 (0-10分)</label>
            <input type="range" id="period-pain-level" class="period-slider" min="0" max="10" value="0" oninput="updatePainLevelDisplay(this.value)">
            <div style="text-align: center; margin-top: 5px; color: #FF9EAA; font-weight: 600;">
              <span id="pain-level-display">0</span> / 10
            </div>
          </div>
          <div class="period-form-group">
            <label>PMS症状（可多选）</label>
            <div class="pms-checkboxes">
              <label><input type="checkbox" class="pms-checkbox" value="胸痛"> 胸痛</label>
              <label><input type="checkbox" class="pms-checkbox" value="腹胀"> 腹胀</label>
              <label><input type="checkbox" class="pms-checkbox" value="易怒"> 易怒</label>
              <label><input type="checkbox" class="pms-checkbox" value="失眠"> 失眠</label>
              <label><input type="checkbox" class="pms-checkbox" value="头痛"> 头痛</label>
              <label><input type="checkbox" class="pms-checkbox" value="疲劳"> 疲劳</label>
              <label><input type="checkbox" class="pms-checkbox" value="食欲增加"> 食欲增加</label>
              <label><input type="checkbox" class="pms-checkbox" value="水肿"> 水肿</label>
              <label><input type="checkbox" class="pms-checkbox" value="长痘"> 长痘</label>
            </div>
            <input type="text" id="period-pms-custom" class="period-input" placeholder="其他症状（用逗号分隔）" style="margin-top: 8px;">
          </div>
          <div class="period-form-group">
            <label>用品更换次数</label>
            <input type="text" id="period-product-changes" class="period-input" placeholder="例如：5次/天">
          </div>
          <div class="period-form-group">
            <label>睡眠质量</label>
            <input type="range" id="period-sleep-quality" class="period-slider" min="1" max="5" value="3" oninput="updateStarDisplay(this.value)">
            <div id="sleep-stars-display" style="text-align: center; margin-top: 5px; font-size: 20px;">⭐⭐⭐☆☆</div>
          </div>
          <div class="period-form-group">
            <label>运动时长（分钟）</label>
            <input type="number" id="period-exercise-duration" class="period-input" placeholder="例如：30" min="0">
          </div>
          <button class="period-btn-primary" onclick="savePeriodRecord()">保存</button>
        </div>
      </div>
    </div>

    <!-- 月经记录 - 详情弹窗 -->
    <div id="period-detail-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <span>详情</span>
          <span class="close-btn" onclick="hidePeriodDetailModal()">×</span>
        </div>
        <div class="modal-body" style="padding: 20px;">
          <div id="period-detail-content"></div>
        </div>
      </div>
    </div>

    <!-- 番茄钟 - 角色选择弹窗 -->
    <div id="focus-companion-modal" class="focus-modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="focus-companion-modal-title">
      <div class="focus-companion-modal-content" tabindex="-1">
        <div class="focus-companion-modal-header">
          <span id="focus-companion-modal-title" class="focus-companion-modal-title">选择陪伴角色</span>
          <button type="button" class="focus-companion-modal-close" onclick="closeFocusCompanionModal()" aria-label="关闭角色选择">×</button>
        </div>
        <div class="focus-companion-modal-body">
          <button type="button" class="focus-companion-none" onclick="confirmFocusCompanion(null)">不使用陪伴角色</button>
          <div id="focus-companion-list"></div>
        </div>
      </div>
    </div>

    <!-- 番茄钟 - 设置弹窗 -->
    <div id="focus-settings-modal" class="focus-modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="focus-settings-title">
      <div class="focus-settings-modal-content" tabindex="-1">
        <div class="focus-settings-modal-header">
          <span id="focus-settings-title">番茄钟设置</span>
          <button type="button" class="focus-companion-modal-close" onclick="closeFocusSettings()" aria-label="关闭设置">×</button>
        </div>
        <div class="focus-settings-form">
          <div class="focus-settings-grid">
            <label class="focus-settings-row"><span class="focus-settings-label">专注时长（分钟）</span><input type="number" id="focus-duration-input" class="focus-settings-input" min="1" max="120" step="1" value="25"></label>
            <label class="focus-settings-row"><span class="focus-settings-label">短休息（分钟）</span><input type="number" id="focus-short-break-input" class="focus-settings-input" min="1" max="60" step="1" value="5"></label>
            <label class="focus-settings-row"><span class="focus-settings-label">长休息（分钟）</span><input type="number" id="focus-long-break-input" class="focus-settings-input" min="1" max="120" step="1" value="15"></label>
            <label class="focus-settings-row"><span class="focus-settings-label">每组专注次数</span><input type="number" id="focus-rounds-input" class="focus-settings-input" min="1" max="12" step="1" value="4"></label>
            <label class="focus-settings-row"><span class="focus-settings-label">定时呼叫间隔（分钟）</span><input type="number" id="auto-call-interval-input" class="focus-settings-input" min="0" max="60" step="1" value="0" placeholder="0 表示关闭"></label>
            <label class="focus-settings-row"><span class="focus-settings-label">有效专注最低时长（分钟）</span><input type="number" id="focus-min-valid-input" class="focus-settings-input" min="1" max="120" step="1" value="1"></label>
          </div>
          <div class="focus-settings-toggles">
            <label class="focus-setting-toggle"><input type="checkbox" id="focus-auto-break-input"><span>完成后自动开始休息</span></label>
            <label class="focus-setting-toggle"><input type="checkbox" id="focus-auto-next-input"><span>休息后自动开始下一轮</span></label>
            <label class="focus-setting-toggle"><input type="checkbox" id="focus-notification-input" checked><span>到时提醒</span></label>
            <label class="focus-setting-toggle"><input type="checkbox" id="focus-sound-input" checked><span>提示音</span></label>
            <label class="focus-setting-toggle"><input type="checkbox" id="focus-vibration-input" checked><span>设备支持时震动</span></label>
            <label class="focus-setting-toggle"><input type="checkbox" id="focus-sync-chat-input"><span>陪伴消息同步到主聊天</span></label>
          </div>
          <div id="focus-settings-error" class="focus-settings-error" role="alert"></div>
          <div class="focus-settings-hint">设置会保存；进行中的会话继续使用开始时的时长与角色。自动呼叫为 0 时保持关闭。</div>
        </div>
        <div class="focus-settings-actions">
          <button type="button" class="focus-btn focus-btn-secondary" onclick="closeFocusSettings()">取消</button>
          <button type="button" class="focus-btn focus-btn-primary" onclick="saveFocusSettings()">保存</button>
        </div>
      </div>
    </div>

    <!-- 番茄钟 - 完成/放弃确认与复盘 -->
    <div id="focus-action-modal" class="focus-modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="focus-action-title">
      <div class="focus-action-modal-content" tabindex="-1">
        <div class="focus-settings-modal-header"><span id="focus-action-title">结束本次专注</span><button type="button" class="focus-companion-modal-close" onclick="closeFocusActionModal()" aria-label="关闭">×</button></div>
        <p id="focus-action-description" class="focus-action-description"></p>
        <label class="focus-settings-row"><span class="focus-settings-label">简短复盘或中断原因（可留空）</span><textarea id="focus-action-note" class="focus-settings-input focus-action-note" rows="3" maxlength="500" placeholder="完成了什么、为什么中断、下一步做什么…"></textarea></label>
        <div class="focus-settings-actions"><button type="button" class="focus-btn focus-btn-secondary" onclick="closeFocusActionModal()">取消</button><button type="button" id="focus-action-confirm" class="focus-btn focus-btn-primary">确认</button></div>
      </div>
    </div>

    <!-- 番茄钟屏幕 -->
    <div id="focus-timer-screen" class="screen">
      <div class="header">
        <span class="back-btn" onclick="showScreen('home-screen')">‹</span>
        <span>番茄钟</span>
        <span style="width: 30px;"></span>
      </div>
      <div id="focus-timer-content" class="list-container"></div>
    </div>
